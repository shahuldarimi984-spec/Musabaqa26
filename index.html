v2:"വേദി 2",

};

function renderSchedules(){

for(const venue in schedules){

 const box=document.getElementById(venue);

 schedules[venue].forEach(item=>{

  const time=item[0];
  const title=item[1];
  const category=item[2];

  if(item[4]==="break"){

   box.innerHTML+=`
   <div class="card break">
   <span class="time-badge">${time}</span>
   <div class="event-title">${title}</div>
   </div>`;

  }else{

   box.innerHTML+=`
   <div class="card"
   data-time="${item[3]}"
   data-endtime="${item[4]}">

   <span class="time-badge">${time}</span>
   <div class="event-title">${title}</div>
   <div class="category">${category}</div>

   </div>`;

  }

 });

}

}

function openVenue(id,btn){

 document.querySelectorAll(".venue-content")
 .forEach(x=>x.classList.remove("active"));

 document.querySelectorAll(".tab-btn")
 .forEach(x=>x.classList.remove("active"));

 document.getElementById(id).classList.add("active");
 btn.classList.add("active");

}

function searchCode(){

 const query=document
 .getElementById("searchInput")
 .value
 .trim()
 .toLowerCase();

 const result=document.getElementById("searchResult");

 result.innerHTML="";

 if(!query){
  return;
 }

 const words=query.split(/\s+/);
 const matches=[];

 for(const venue in schedules){

  schedules[venue].forEach(item=>{

   if(item[4]==="break") return;

   const text=(item[1]+" "+item[2]).toLowerCase();

   if(words.every(word=>text.includes(word))){

    matches.push({
     venue:venueNames[venue],
     time:item[0],
     title:item[1],
     category:item[2],
     start:item[3],
     end:item[4]
    });

   }

  });

 }

 if(matches.length===0){

  result.innerHTML=`
  <div class="card">
  ഇനം കണ്ടെത്തിയില്ല. കോഡ് നമ്പറോ ഇനത്തിന്റെ പേരോ പരിശോധിക്കുക.
  </div>`;

  return;
 }

 matches.forEach(item=>{

  result.innerHTML+=`
  <div class="card">
   <span class="venue-badge">${item.venue}</span>
   <span class="time-badge">${item.time}</span>
   <div class="event-title">${item.title}</div>
   <div class="category">${item.category}</div>
  </div>`;

 });

}

function updateCountdown(){

 const target=new Date(
 "2026-10-10T08:30:00+05:30"
 ).getTime();

 const now=new Date().getTime();
 const diff=target-now;

 const box=document.getElementById("countdown");

 if(diff<=0){

  box.innerHTML="<span>🎉<br>മുസാബഖ ആരംഭിച്ചു!</span>";
  return;

 }

 const days=Math.floor(
 diff/(1000*60*60*24)
 );

 const hours=Math.floor(
 (diff/(1000*60*60))%24
 );

 const minutes=Math.floor(
 (diff/(1000*60))%60
 );

 const seconds=Math.floor(
 (diff/1000)%60
 );

 box.innerHTML=`
 <span>📅<br>${days}<small>ദിവസം</small></span>
 <span>🕐<br>${hours}<small>മണിക്കൂർ</small></span>
 <span>⏱️<br>${minutes}<small>മിനിറ്റ്</small></span>
 <span>⚡<br>${seconds}<small>സെക്കന്റ്</small></span>
 `;

}

updateCountdown();
setInterval(updateCountdown,1000);
